if(f.id=='pf'){const i=S.it.find(x=>x.id==g('pi').value),q=+g('pq').value,c=+g('pc').value;i.cost=c;i.price=+g('ps').value;S.log.push({t:new Date(g('pd').value+'T12:00').getTime(),ty:'p',i:i.id,n:i.name,q,c});if(save())toast(t('saved'));render();return}
if(f.dataset.k=='s'){const n=g('fn').value.trim();if(M.id){const s=S.sec.find(s=>s.id==M.id);s.n=n;s.ic=M.ic}else S.sec.push({id:uid(),n,ic:M.ic||'🛒'})}
else{const o={sec:g('fs').value,name:g('fn').value.trim(),cost:+g('fc').value,price:+g('fp').value,img:M.i.img};if(M.id)Object.assign(S.it.find(i=>i.id==M.id),o);else S.it.push({id:uid(),ord:Date.now(),...o})}
M=null;save();render()});
document.addEventListener('change',e=>{const i=e.target.id;if(i=='cu'){S.cur=e.target.value.trim()||'$';save()}else if(i=='pi'){const x=S.it.find(y=>y.id==e.target.value);g('pc').value=x.cost;g('ps').value=x.price}else if(i=='ph')photo(e.target.files[0]);else if(i=='imp')impf(e.target.files[0])});
document.addEventListener('input',()=>{if(M&&M.k=='i')upd()});
document.addEventListener('keydown',e=>{if(P){if(/^\d$/.test(e.key))pk(e.key);else if(e.key=='Backspace'){P.buf=P.buf.slice(0,-1);render()}else if(e.key=='Escape'){P=null;render()}}else if(M&&e.key=='Escape'){M=null;render()}});
render();boot();
</script>
